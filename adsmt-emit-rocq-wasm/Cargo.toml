[package]
name = "adsmt-emit-rocq-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rocq emitter as a wasip1 command: CBOR certificate on stdin, Rocq (Ltac2) source on stdout. The adsmt-emit-rocq library compiled to a wasm package for the adsmt-emit runtime."

[[bin]]
name = "rocq"
path = "src/main.rs"

[dependencies]
adsmt-emit-rocq = { path = "../adsmt-emit-rocq" }
# adsmt-cert always carries serde (its canonical types derive it
# unconditionally + it enables adsmt-core/serde), so Certificate is
# Deserialize without any extra feature here.
adsmt-cert = { workspace = true }
ciborium = "0.2"

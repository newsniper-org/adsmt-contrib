[package]
name = "adsmt-emit-isabelle-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isabelle/HOL emitter as a wasip1 command: CBOR certificate on stdin, Isabelle source on stdout. The adsmt-emit-isabelle library compiled to a wasm package for the adsmt-emit runtime."

[[bin]]
name = "isabelle"
path = "src/main.rs"

[dependencies]
adsmt-emit-isabelle = { path = "../adsmt-emit-isabelle" }
adsmt-cert = { workspace = true }
ciborium = "0.2"
